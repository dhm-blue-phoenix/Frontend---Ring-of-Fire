<section>
    <div class="dialog-container">
        <h1 mat-dialog-title>Add new player (Max 6 Players)</h1>
        <div mat-dialog-content>
            <p>Please enter the of a player.</p>
            <mat-form-field class="form-field">
                <mat-label>Name</mat-label>
                <input matInput [(ngModel)]="name">
            </mat-form-field>
        </div>
        <div mat-dialog-actions>
            <button mat-button mat-dialog-close>No Thanks</button>
            <button mat-button [mat-dialog-close]="name" [disabled]="name.length === 0" FocusInitial>Ok</button>
        </div>
    </div>
</section>
